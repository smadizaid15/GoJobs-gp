name: CI

# Verification-only. No step in this workflow deploys, publishes, or
# releases anything — see docs/operations/CI_CD.md for the full Phase 1
# CI/CD design and the reasoning behind that boundary. The legacy
# `main.yml` Docker Hub publishing workflow was removed, not converted,
# because it baked a client secret (API_CONFIG_DART) into a published
# image on every push to main; a real deployment pipeline is a separate,
# later, explicitly-approved piece of work.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  flutter-checks:
    name: Flutter checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build verification (debug APK, not a release artifact)
        run: flutter build apk --debug

  rules-tests:
    name: Firebase security rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Setup Java (required by the Firebase Emulator Suite)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install emulator test dependencies
        working-directory: firebase-emulator-tests
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.29.0

      - name: Run security rules test suite (133 cases, emulator-only)
        run: firebase emulators:exec "cd firebase-emulator-tests && npm test"
